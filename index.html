<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        input, button {
            display: block;
            margin: 10px auto;
            padding: 8px;
            width: 220px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>تسجيل الدخول</h2>
    <form>
        <label>اسم المستخدم</label>
        <input type="text" required>
        
        <label>كلمة المرور</label>
        <input type="password" required>
        
        <button type="submit">دخول</button>
    </form>
</body>
</html>
